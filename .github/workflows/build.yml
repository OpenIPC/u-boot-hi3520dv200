name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        soc: [hi3520dv200]

    steps:
      - name: Install 32-bit libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g:i386 libc6:i386 libstdc++6:i386

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: toolchain
          key: arm-hisiv200-linux-v1

      - name: Download toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1 -R OpenIPC/toolchains \
            -p 'arm-hisiv200-linux.tgz'
          mkdir -p toolchain
          tar xzf arm-hisiv200-linux.tgz -C toolchain
          if [ -f toolchain/arm-hisiv200-linux/arm-hisiv200-linux.tar.bz2 ]; then
            tar xjf toolchain/arm-hisiv200-linux/arm-hisiv200-linux.tar.bz2 \
                -C toolchain
          fi
          rm arm-hisiv200-linux.tgz
          # vendor compressed/Makefile pins the short prefix
          # `arm-hisiv200-linux-`; the bin/ dir ships gnueabi-suffixed
          # binaries. Create short-name symlinks the same way the rest
          # of the OpenIPC u-boot fleet does for hisiv500/510 et al.
          cd toolchain/arm-hisiv200-linux/bin
          for f in arm-hisiv200-linux-gnueabi-*; do
            [ -e "$f" ] || continue
            ln -sf "$f" "${f/-gnueabi/}"
          done

      - name: Build
        run: |
          export PATH="$PWD/toolchain/arm-hisiv200-linux/bin:$PATH"
          make hi3520d_config
          make CROSS_COMPILE=arm-hisiv200-linux- u-boot.bin -j$(nproc)
          # Replicate vendor's mkboot-hi3520d.sh: prepend the two 2400 B
          # DDR/PLL register-init blobs into the 4800 B blank zone that
          # hi3520d.h's ENABLE_HI3520D_BLANK + ENABLE_HI3515A_BLANK reserves
          # in u-boot.bin (start.S:54-61). The vendor SDK's prebuilt
          # u-boot_hi3520d.bin is assembled this way — raw u-boot.bin + reg
          # blobs, NOT the compressed/ mini-boot LZMA wrapper. Defib's
          # SPL-boundary heuristic stays in safe fallback mode this way
          # (no LZMA payload to detect), matching how every other fleet
          # member with no LZMA in defib's 0x4000..0x10000 scan window
          # (vendor hi3520d, hi3516cv500, hi3516ev200) gets handled.
          dd if=u-boot.bin                      of=t1 bs=1    count=64    2>/dev/null
          dd if=reg_info_${{ matrix.soc }}.bin1 of=t2 bs=2400 conv=sync   2>/dev/null
          dd if=reg_info_${{ matrix.soc }}.bin2 of=t3 bs=2400 conv=sync   2>/dev/null
          dd if=u-boot.bin                      of=t4 bs=1    skip=4864   2>/dev/null
          cat t1 t2 t3 t4 > u-boot-${{ matrix.soc }}-universal.bin
          rm -f t1 t2 t3 t4

      - name: Check partition fit
        run: |
          # Boot partition is 256 KiB across every OpenIPC HiSi mtdparts
          # (hi-common.h / gk-common.h) regardless of IP-camera vs DVR
          # form factor. Anything past that overflows env at offset
          # 0x40000 and bricks the device on upgrade. Mirrors
          # OpenIPC/firmware Makefile CHECK_SIZE.
          FILE=u-boot-${{ matrix.soc }}-universal.bin
          LIMIT_KB=256
          SIZE_KB=$(($(stat -c %s "$FILE") / 1024))
          echo "- $FILE: [${SIZE_KB}KB/${LIMIT_KB}KB]"
          if [ "$SIZE_KB" -gt "$LIMIT_KB" ]; then
            echo "-- size exceeded by: $((SIZE_KB - LIMIT_KB))KB"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}-universal
          path: u-boot-${{ matrix.soc }}-universal.bin

  qemu_smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { soc: hi3520dv200, machine: hi3520dv200 }
    steps:
      - name: Install QEMU build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv

      - name: Resolve qemu-hisilicon HEAD
        id: qemu-rev
        run: |
          sha=$(git ls-remote https://github.com/widgetii/qemu-hisilicon master | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache qemu-system-arm
        id: cache-qemu
        uses: actions/cache@v4
        with:
          path: qemu-arm
          key: qemu-hisilicon-${{ steps.qemu-rev.outputs.sha }}

      - name: Build qemu-system-arm (cache miss)
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch master \
            https://github.com/widgetii/qemu-hisilicon qemu-hisilicon
          cd qemu-hisilicon
          bash qemu/setup.sh
          cp qemu-src/build/qemu-system-arm "$GITHUB_WORKSPACE/qemu-arm"
          chmod +x "$GITHUB_WORKSPACE/qemu-arm"

      - name: Download u-boot artifact
        uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}-universal

      - name: Smoke-test in QEMU
        timeout-minutes: 2
        run: |
          UBOOT="$PWD/u-boot-${{ matrix.soc }}-universal.bin"
          test -f "$UBOOT"
          dd if=/dev/zero of=/tmp/flash.bin bs=1M count=8 2>/dev/null
          dd if="$UBOOT" of=/tmp/flash.bin bs=1 conv=notrunc 2>/dev/null
          mkfifo /tmp/uart.in /tmp/uart.out
          chmod +x ./qemu-arm
          ./qemu-arm \
            -M ${{ matrix.machine }},flash-file=/tmp/flash.bin \
            -nographic -serial pipe:/tmp/uart \
            -monitor none > /tmp/qemu.log 2>&1 &
          QEMU_PID=$!
          timeout 10 cat /tmp/uart.out > /tmp/uboot.txt || true
          kill "$QEMU_PID" 2>/dev/null || true
          wait 2>/dev/null || true
          echo "== captured u-boot output =="
          cat /tmp/uboot.txt
          echo
          if grep -qE 'U-Boot |Hit any key|CPU:|DRAM:|Board:|hisilicon #' /tmp/uboot.txt; then
            echo "PASS: u-boot booted past System startup"
          else
            echo "FAIL: u-boot did not get past System startup"
            tail -40 /tmp/qemu.log || true
            exit 1
          fi

  publish:
    needs: [build, qemu_smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to OpenIPC/firmware latest release
        env:
          GH_TOKEN: ${{ secrets.FIRMWARE_RELEASE_TOKEN }}
        run: |
          set -eu
          upload() {
            local f="$1" i
            for i in 1 2 3 4 5; do
              if gh release upload latest "$f" --clobber -R OpenIPC/firmware; then
                return 0
              fi
              [ "$i" = "5" ] && return 1
              echo "upload attempt $i failed; sleeping $((i*10))s" >&2
              sleep $((i*10))
            done
          }
          for soc in hi3520dv200; do
            f="artifacts/u-boot-${soc}-universal/u-boot-${soc}-universal.bin"
            test -f "$f"
            upload "$f"
          done
