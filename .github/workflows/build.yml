name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        soc: [hi3520dv200]

    steps:
      - name: Install 32-bit libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g:i386 libc6:i386 libstdc++6:i386

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: toolchain
          key: arm-hisiv200-linux-v1

      - name: Download toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1 -R OpenIPC/toolchains \
            -p 'arm-hisiv200-linux.tgz'
          mkdir -p toolchain
          tar xzf arm-hisiv200-linux.tgz -C toolchain
          if [ -f toolchain/arm-hisiv200-linux/arm-hisiv200-linux.tar.bz2 ]; then
            tar xjf toolchain/arm-hisiv200-linux/arm-hisiv200-linux.tar.bz2 \
                -C toolchain
          fi
          rm arm-hisiv200-linux.tgz
          # vendor compressed/Makefile pins the short prefix
          # `arm-hisiv200-linux-`; the bin/ dir ships gnueabi-suffixed
          # binaries. Create short-name symlinks the same way the rest
          # of the OpenIPC u-boot fleet does for hisiv500/510 et al.
          cd toolchain/arm-hisiv200-linux/bin
          for f in arm-hisiv200-linux-gnueabi-*; do
            [ -e "$f" ] || continue
            ln -sf "$f" "${f/-gnueabi/}"
          done

      - name: Build
        run: |
          export PATH="$PWD/toolchain/arm-hisiv200-linux/bin:$PATH"
          make hi3520d_config
          # Hi3520D's compressed/Makefile dd's two register-init blobs
          # (.reg1 + .reg2) into mini-boot.bin at offsets 64 and 2464.
          # Extracted verbatim from the SDK V2.0.5.1 prebuilt
          # u-boot_hi3520d.bin via the same `dd skip=64/2464 count=2400`
          # the vendor mkboot-hi3520d.sh applies in reverse.
          cp reg_info_${{ matrix.soc }}.bin1 .reg1
          cp reg_info_${{ matrix.soc }}.bin2 .reg2
          make CROSS_COMPILE=arm-hisiv200-linux- -j$(nproc)
          make CROSS_COMPILE=arm-hisiv200-linux- mini-boot.bin
          cp mini-boot.bin u-boot-${{ matrix.soc }}-universal.bin

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}-universal
          path: u-boot-${{ matrix.soc }}-universal.bin

  # qemu_smoke / publish jobs to be added once the build job is green.
  # widgetii/qemu-hisilicon's `hi3520dv200` machine boots Linux via
  # -kernel; u-boot flash boot will need exercising once a buildable
  # mini-boot.bin lands.
